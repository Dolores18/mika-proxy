[package]
name = "proxy"
version = "0.1.0"
edition = "2024"
default-run = "proxy"

[lib]
name = "proxy"
path = "src/lib.rs"

[[bin]]
name = "proxy-server"
path = "src/bin/proxy-server.rs"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.6"
async-trait = "0.1.77"
thiserror = "1.0"
flume = "0.10"
trust-dns-resolver = "0.22.0"
socket2 = "0.5.3"
itertools = "0.11.0"
subtle = "2.4.1"
md-5 = "0.10.5"
log = "0.4"
env_logger = "0.10"
toml = "0.8"
cipher = { version = "0.4", optional = false }
crossbeam-channel = "0.5"

sha1 = { version = "0.10", optional = false }
sha2 = { version = "0.10", optional = false }
aes-gcm = { version = "0.10", optional = false }
chacha20poly1305 = { version = "0.10", optional = false }
rc4 = { version = "0.1", optional = false }
chacha20 = { version = "0.9", optional = false }
camellia = { version = "0.1", optional = false }
ctr = { version = "0.9", optional = false }
cfb-mode = { version = "0.8", optional = false }
hkdf = { version = "0.12", optional = false }
hmac = { version = "0.12", optional = false }
const-fnv1a-hash = { version = "1", optional = false }
sha3 = { version = "0.10", optional = false }
crc32fast = { version = "1", optional = false}
getrandom = "^0.2"
base64 = "0.21" 
pin-project-lite = "0.2"
httparse = { version = "1", optional = false }
url = "2.2"
warp = "0.3"
http = "1.2.0"
hyper = { version = "0.14", features = ["full"] }
tokio-util = "0.7"
hyper-rustls = { version = "0.25", features = ["http2"] }
rustls = "0.23"
rustls-native-certs = "0.7"
lazy_static = "1.4"
aho-corasick = "0.7"
maxminddb = "0.23"
cidr = "0.2"
regex = "1.0"
serde_json = "1.0.140"
cbor4ii = {version = "1.0.0", features = ["serde"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
refinery = "0.8.16"
lru = { version = "0.12" }
smoltcp = "0.11"
tun = { version = "0.7", features = ["async", "tokio"] }
libc = "0.2.171"
parking_lot = "0.12.1"
nix = "0.26.2"
netstack-smoltcp = "0.1.3"
hickory-proto = "0.25.1"
tuic = { tag = "v1.4.5", git = "https://github.com/Itsusinn/tuic.git" }
tuic-quinn = { tag = "v1.4.5",git = "https://github.com/Itsusinn/tuic.git" }
register-count = { version = "0.1"}

quinn = { version = "0.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls"] }
anyhow = "1.0.98"
tracing = "0.1.41"
uuid = "1.16.0"
once_cell = "1.21.3"
webpki-roots = "0.26.8"
quinn-proto = { version = "0.11.13", default-features = false }
blake2 = "0.10.6"
digest = "0.10.7"
bytes = "1.5"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rand = "0.9"
[features]
lru = []
